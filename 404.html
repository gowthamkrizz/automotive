<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 &#8211; Page Not Found | Stackly Luxury Automotive</title>
    
    <!-- Favicon -->
    <link rel="icon" href="assets/images/cropped-logo-1-32x32.webp" sizes="32x32" type="image/webp">
    <link rel="apple-touch-icon" href="assets/images/cropped-logo-1-180x180.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Montserrat:wght@400;500;600;700;800;900&family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Base CSS Styles & Specialized 404 CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/404.css">
</head>
<body class="error-page">

    <!-- Page Preloader -->
    <div class="page-loader-wrapper" id="pageLoader">
        <div class="loader-content">
            <div class="loader-text-content">
                <div class="text-loader-content-wrap">
                    <div class="loader-text">STACKLY</div>
                    <div class="loader-text-progress">STACKLY</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content: Fullscreen 3D 404 Experience Stage -->
    <main class="site-main error-page-wrapper">
        <!-- 3D Background Elements -->
        <div class="error-cyber-grid"></div>
        <div class="error-radar-ring error-radar-ring--1"></div>
        <div class="error-radar-ring error-radar-ring--2"></div>
        <div class="error-radar-ring error-radar-ring--3"></div>
        <div class="error-ambient-glow"></div>

        <!-- Interactive 3D Card Stage -->
        <div class="error-3d-stage">
            <div class="error-main-container">
                <!-- HUD Status Badge -->
                <div class="error-hud-badge">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Navigation Matrix Alert &bull; 404 Off Grid</span>
                </div>

                <!-- Giant 3D 404 Title -->
                <div class="error-title-wrap">
                    <h1 class="error-giant-title" data-text="404">404</h1>
                </div>

                <!-- Descriptive Error Message -->
                <h2 class="error-heading">
                    Route Coordinates <span>Lost In Transmission</span>
                </h2>
                <p class="error-description">
                    The vehicle listing, article, or page destination you are looking for does not exist or has been relocated to our private collection.
                </p>

                <!-- Interactive 3D Moving Supercar Track -->
                <div class="error-car-track-container">
                    <div class="cyber-road-line"></div>
                    <div class="moving-speed-sparks">
                        <span class="spark s1"></span>
                        <span class="spark s2"></span>
                        <span class="spark s3"></span>
                        <span class="spark s4"></span>
                    </div>
                    
                    <div class="error-animated-car" id="movingCar" title="Stackly Hypercar Matrix">
                        <!-- Headlight Projection Beam -->
                        <div class="car-headlight-beam"></div>
                        <!-- Taillight Laser Trail -->
                        <div class="car-taillight-trail"></div>
                        <!-- Underglow Neon -->
                        <div class="car-underglow"></div>

                        <!-- Exotic Supercar SVG -->
                        <svg class="supercar-svg" viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#3a3d46"/>
                                    <stop offset="35%" stop-color="#1c1e24"/>
                                    <stop offset="70%" stop-color="#101216"/>
                                    <stop offset="100%" stop-color="#DD0005"/>
                                </linearGradient>
                                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
                                    <stop offset="100%" stop-color="rgba(12,18,28,0.9)"/>
                                </linearGradient>
                                <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#ff2e2e"/>
                                    <stop offset="100%" stop-color="#DD0005"/>
                                </linearGradient>
                            </defs>
                            
                            <!-- Aerodynamic Body Shell -->
                            <path d="M 20,68 Q 25,48 55,46 L 105,42 Q 135,22 175,20 L 230,22 Q 258,25 285,48 L 305,58 Q 315,64 312,72 L 295,74 Q 288,74 282,68 C 275,56 250,56 242,68 L 120,68 C 112,56 88,56 80,68 L 35,74 Q 20,74 20,68 Z" fill="url(#carBodyGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
                            
                            <!-- Windshield & Side Windows -->
                            <path d="M 120,42 L 165,26 Q 195,24 225,26 L 245,44 Q 200,43 140,43 Z" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
                            
                            <!-- Roof Pillar / Trim -->
                            <path d="M 180,25 L 188,43" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
                            
                            <!-- Red Racing Aerodynamic Side Strakes -->
                            <path d="M 50,54 L 140,50 Q 230,48 290,56" stroke="url(#redAccentGrad)" stroke-width="2.2" stroke-linecap="round"/>
                            <path d="M 110,60 L 240,58" stroke="rgba(221,0,5,0.7)" stroke-width="1.5" stroke-linecap="round"/>

                            <!-- Front LED Matrix Headlight -->
                            <polygon points="300,56 312,62 306,66 295,60" fill="#00e5ff" filter="drop-shadow(0 0 6px #00e5ff)"/>
                            <polygon points="302,57 310,61 306,64 298,60" fill="#ffffff"/>

                            <!-- Rear LED Tail-light Bar -->
                            <path d="M 22,60 L 32,58" stroke="#ff0019" stroke-width="3.5" stroke-linecap="round" filter="drop-shadow(0 0 6px #ff0019)"/>

                            <!-- Rear Spoiler Wing -->
                            <path d="M 18,50 L 38,48 L 42,54 L 16,55 Z" fill="#111" stroke="#DD0005" stroke-width="1"/>
                            
                            <!-- Rear Wheel Assembly -->
                            <g class="wheel-group rear-wheel" transform="translate(100, 68)">
                                <circle cx="0" cy="0" r="16" fill="#0d0e12" stroke="#2c2d35" stroke-width="3"/>
                                <circle cx="0" cy="0" r="12" fill="#15171e"/>
                                <path d="M -8,-6 A 10 10 0 0 1 -2,-10" stroke="#DD0005" stroke-width="3.5" stroke-linecap="round"/>
                                <line x1="0" y1="-12" x2="0" y2="12" stroke="#e0e0e0" stroke-width="1.8"/>
                                <line x1="-12" y1="0" x2="12" y2="0" stroke="#e0e0e0" stroke-width="1.8"/>
                                <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="#999" stroke-width="1.5"/>
                                <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5" stroke="#999" stroke-width="1.5"/>
                                <circle cx="0" cy="0" r="3.5" fill="#DD0005"/>
                            </g>

                            <!-- Front Wheel Assembly -->
                            <g class="wheel-group front-wheel" transform="translate(262, 68)">
                                <circle cx="0" cy="0" r="16" fill="#0d0e12" stroke="#2c2d35" stroke-width="3"/>
                                <circle cx="0" cy="0" r="12" fill="#15171e"/>
                                <path d="M -8,-6 A 10 10 0 0 1 -2,-10" stroke="#DD0005" stroke-width="3.5" stroke-linecap="round"/>
                                <line x1="0" y1="-12" x2="0" y2="12" stroke="#e0e0e0" stroke-width="1.8"/>
                                <line x1="-12" y1="0" x2="12" y2="0" stroke="#e0e0e0" stroke-width="1.8"/>
                                <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5" stroke="#999" stroke-width="1.5"/>
                                <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5" stroke="#999" stroke-width="1.5"/>
                                <circle cx="0" cy="0" r="3.5" fill="#DD0005"/>
                            </g>
                        </svg>
                    </div>
                </div>

                <!-- Primary Action Controls -->
                <div class="error-actions-group">
                    <a href="index.html" class="btn-error-primary">
                        <i class="fa-solid fa-house"></i>
                        <span>Back to Home</span>
                    </a>
                    <button type="button" class="btn-error-ghost" id="errorGoBackBtn" onclick="stacklyGoBack(event)" aria-label="Go Back to Previous Page">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back to Previous</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Minimal Clean Bottom Tagline -->
        <div class="error-footer-minimal">
            &copy; 2026 <strong>Stackly</strong> &#8211; Luxury Automotive Dealership
        </div>
    </main>

    <!-- Main JS & 404 Motion Script -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/404.js"></script>
</body>
</html>
